<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Boletim Técnico - NOX Cor</title>

    <!-- Dependências Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@700&family=Montserrat:wght@900&family=Nunito:wght@400;600;700&family=Titillium+Web:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- CSS EXTERNO SEPARADO -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/logo.css">
</head>

<body>

    <!-- Input Global Escondido para Upload da Logo -->
    <input type="file" id="global-logo-upload" accept="image/*" style="display: none;">

    <!-- BARRA DE CONTROLES SUPERIOR -->
    <div class="controls no-print">
        <div class="toolbar">
            <button data-command="bold" title="Negrito"><b>B</b></button>
            <button data-command="italic" title="Itálico"><i>I</i></button>
            <button data-command="underline" title="Sublinhado"><u>U</u></button>
            <button data-command="insertUnorderedList" title="Lista">●</button>
        </div>

        <div class="template-selector">
            <label style="font-size: 12px; font-weight: bold; font-family: var(--font-body);">Gerar Novo:</label>
            <select id="template-type">
                <option value="tinta">Tinta / Epóxi (3 Págs - Completo)</option>
                <option value="thinner">Diluente / Thinner (1 Pág)</option>
            </select>
            <button id="btn-generate-template" style="background-color: var(--nox-orange);">Aplicar Molde</button>
        </div>

        <div style="width: 1px; height: 30px; background-color: #ccc; margin: 0 10px;"></div>

        <div class="actions" style="display: flex; gap: 8px; align-items: center;">
            <a href="ficha-emergencia.html"
               style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;font-weight:bold;background-color:#c0392b;color:white;border-radius:5px;text-decoration:none;font-family:var(--font-body);white-space:nowrap;transition:background .2s;"
               title="Ficha de Emergência de Transporte">
                🚨 Ficha de Emergência
            </a>
            <button id="btn-save-project" class="secondary" title="Salvar Projeto (JSON)">💾 Salvar</button>
            <button id="btn-load-project" class="secondary" title="Carregar Projeto">📂 Abrir</button>
            <input type="file" id="file-input" style="display: none;" accept=".json,.doc,.html">
            <button id="btn-ai-fill" class="secondary" title="Preencher com IA Avançada"
                style="background-color: #673ab7; font-weight: bold;">✨ Extração IA Profunda</button>
            <input type="file" id="file-input-pdf" style="display: none;" accept=".pdf">
            <button onclick="window.print()" title="Imprimir / Gerar PDF Real">🖨️ Imprimir PDF</button>
        </div>
    </div>

    <!-- CONTAINER DAS PÁGINAS -->
    <div id="pages-container"></div>

    <!-- REPOSITÓRIO DE TEMPLATES ATÔMICOS (Oculto - Usado pelo PageBuilder) -->
    <div id="templates-repository" style="display: none;">

        <!-- Base de Página A4 -->
        <template id="tpl-page-base">
            <div class="page">
                <div class="header">
                    <img class="doc-logo-img" src="assets/logo.svg" alt="Logo NOX Cor">
                    <div class="header-info">
                        <div class="ficha-title"><span class="cyan">FICHA</span> <span class="blue">TÉCNICA</span></div>
                        <div class="company-info editable" contenteditable="true">
                            <strong>Kromo Industria e Comércio de Tintas LTDA</strong><br>
                            Rua: Nílton Penna Botelho, nº 4111 - Pinheiral-RJ<br>
                            CEP: 27197-000 | Telefone: (24) 3016 4937<br>
                            www.noxcor.com.br - sac@noxcor.com.br
                        </div>
                    </div>
                </div>
                <div class="product-bar editable" contenteditable="true" data-ai-field="product_title">NOME DO PRODUTO
                </div>
                <div class="page-content" style="display: flex; flex-direction: column; gap: 0px;"></div>
            </div>
        </template>

        <!-- Bloco de Texto Simples -->
        <template id="tpl-block-text">
            <div class="section-block" style="margin-bottom: 5px;">
                <div class="section-wrapper">
                    <div class="section-title"></div>
                </div>
                <div class="editable section-body" contenteditable="true" style="padding-left: 10px; min-height: 20px;">
                </div>
            </div>
        </template>

        <!-- Bloco com Ícone -->
        <template id="tpl-block-icon">
            <div class="section-block" style="margin-bottom: 5px;">
                <div class="section-wrapper">
                    <div class="section-title"></div>
                </div>
                <div class="icon-row">
                    <div class="icon-box"><img src="" alt="Icon" /></div>
                    <div class="icon-text-content editable section-body" contenteditable="true"
                        style="min-height: 40px; padding-top: 5px;"></div>
                </div>
            </div>
        </template>

        <!-- Bloco de Aplicação Específico (Vazio para receber tabelas da IA) -->
        <template id="tpl-block-application">
            <div class="section-block" style="margin-bottom: 5px;">
                <div class="section-wrapper">
                    <div class="section-title">APLICAÇÃO</div>
                </div>
                <div class="editable section-body" contenteditable="true"
                    style="display: flex; flex-direction: column; gap: 15px;"></div>
            </div>
        </template>

    </div>

    <!-- MODAL IA ATUALIZADO (Totalmente Dinâmico) -->
    <div id="ai-modal" class="modal-overlay">
        <div class="modal" style="max-width: 650px; max-height: 90vh; overflow-y: auto;">
            <h3>Extração Dinâmica de PDF</h3>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Selecione os campos que a IA deve buscar e
                gerar para montar a sua ficha.</p>

            <div class="form-group">
                <label for="ai-model-select">Modelo de Processamento:</label>
                <select id="ai-model-select">
                    <option value="gemini-3-flash-preview" selected>Gemini 3 Flash Preview (Padrão)</option>
                    <option value="gemini-3-pro-preview">Gemini 3 Pro Preview</option>
                    <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash Preview</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label>Campos a Extrair (Construção da Página):</label>

                <!-- Botões de Predefinição -->
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button id="preset-tinta" style="font-size: 10px; padding: 4px 8px;">Predefinição: Tinta</button>
                    <button id="preset-thinner" style="font-size: 10px; padding: 4px 8px;">Predefinição:
                        Thinner</button>
                    <button id="preset-clear" class="secondary" style="font-size: 10px; padding: 4px 8px;">Limpar
                        Tudo</button>
                </div>

                <!-- Container onde o JS vai renderizar os Checkboxes Múltiplos -->
                <div id="ai-fields-container"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f9f9f9; padding: 10px; border: 1px solid #ddd; border-radius: 4px; max-height: 150px; overflow-y: auto;">
                    <!-- Renderizado pelo ai-manager.js -->
                </div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label for="ai-product-name">Forçar Nome do Produto (Opcional):</label>
                <input type="text" id="ai-product-name" placeholder="Deixe em branco para a IA detectar no PDF">
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label for="ai-extra-instructions">Instruções Extras para a IA (Opcional):</label>
                <textarea id="ai-extra-instructions" rows="3"
                    placeholder="Ex: Substitua a marca X pela marca Y em todos os textos. Formate os rendimentos em negrito."
                    style="padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; font-size: 13px; resize: vertical;"></textarea>
            </div>

            <div class="modal-actions" style="margin-top: 20px;">
                <button id="btn-cancel-ai" class="btn-cancel">Cancelar</button>
                <button id="btn-confirm-ai" style="background-color: #673ab7; color: white;">✨ Gerar Ficha
                    Customizada</button>
            </div>
        </div>
    </div>

    <!-- CARREGAMENTO DO FICHEIRO EXTERNO JAVASCRIPT -->
    <script type="module" src="js/main.js"></script>

</body>

</html>
